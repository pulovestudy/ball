<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>&#35328;&#28789; | Dreamworld Home</title>
  <style>
    :root {
      --bg-deep: #1e1f2b;
      --bg-mid: #272a42;
      --mist: rgba(162, 123, 255, 0.22);
      --orange: #ff9e6d;
      --blue: #5da9e9;
      --purple: #8b6be8;
      --cyan: #59d9c2;
      --yellow: #ffd166;
      --white: #f6f3ff;
      --ink: #e7e0ff;
      --ink-soft: rgba(231, 224, 255, 0.74);
      --glass: rgba(26, 28, 45, 0.46);
      --glass-strong: rgba(30, 33, 54, 0.7);
      --line: rgba(255, 255, 255, 0.12);
      --shadow: rgba(3, 4, 10, 0.44);
      --font-display: "Trebuchet MS", "Verdana", sans-serif;
      --font-body: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --camera-x: 0vw;
      --accent: var(--orange);
      --accent-2: var(--yellow);
      --hero-a: #7aa6ff;
      --hero-b: #9b7bff;
      --hero-c: #d6f0ff;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(87, 91, 164, 0.28), transparent 38%),
        radial-gradient(circle at 20% 20%, rgba(93, 169, 233, 0.18), transparent 25%),
        radial-gradient(circle at 80% 14%, rgba(255, 158, 109, 0.12), transparent 24%),
        linear-gradient(180deg, #141624 0%, #1a1d2c 40%, #171a28 100%);
      color: var(--ink);
      font-family: var(--font-body);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 158, 109, 0.18), transparent 20%),
        radial-gradient(circle at 78% 18%, rgba(89, 217, 194, 0.14), transparent 18%),
        radial-gradient(circle at 54% 6%, rgba(139, 107, 232, 0.2), transparent 26%);
      filter: blur(28px);
      animation: slowShift 20s ease-in-out infinite alternate;
    }

    body::after {
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.26) 0.7px, transparent 0.7px),
        radial-gradient(rgba(255, 255, 255, 0.18) 0.6px, transparent 0.6px);
      background-size: 120px 120px, 70px 70px;
      background-position: 0 0, 28px 42px;
      opacity: 0.16;
      mix-blend-mode: screen;
    }

    #app {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      z-index: 1;
    }

    .shell {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)) 18px;
    }

    .topbar {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      z-index: 5;
    }

    .brand {
      display: grid;
      gap: 2px;
      padding: 14px 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(34, 37, 60, 0.82), rgba(24, 27, 44, 0.72));
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 0 18px 44px -30px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .brand small {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(232, 229, 255, 0.54);
    }

    .brand strong {
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: 0.14em;
      color: var(--white);
      text-shadow: 0 0 26px rgba(165, 135, 255, 0.2);
    }

    .runes {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(39, 43, 70, 0.74), rgba(23, 25, 41, 0.68));
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 0 22px 50px -36px var(--shadow);
      backdrop-filter: blur(20px);
    }

    .rune {
      position: relative;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--white);
      font: 700 28px/1 var(--font-display);
      background:
        radial-gradient(circle at 28% 24%, rgba(255, 255, 255, 0.28), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)),
        var(--tone);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 10px 24px -12px rgba(0, 0, 0, 0.36),
        0 0 30px -10px var(--glow);
      cursor: pointer;
      overflow: hidden;
      transition: transform 220ms ease, box-shadow 220ms ease, filter 220ms ease;
      animation: runeHover 5.6s ease-in-out infinite;
    }

    .rune::before,
    .rune::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .rune::before {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), transparent 40%);
      mix-blend-mode: screen;
    }

    .rune::after {
      inset: -8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      opacity: 0;
      transform: scale(0.92);
    }

    .rune:hover,
    .rune:focus-visible,
    .rune.active {
      transform: translateY(-3px) scale(1.04);
      filter: brightness(1.08);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 14px 30px -12px rgba(0, 0, 0, 0.4),
        0 0 42px -10px var(--glow);
    }

    .rune.active::after {
      animation: runePulse 1s ease;
    }

    .status {
      justify-self: end;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      padding: 12px 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(36, 40, 64, 0.8), rgba(23, 26, 43, 0.68));
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 0 18px 44px -30px var(--shadow);
      backdrop-filter: blur(18px);
      min-width: 104px;
    }

    .badge span {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(232, 229, 255, 0.54);
    }

    .badge strong {
      display: block;
      margin-top: 4px;
      color: var(--white);
      font-size: 16px;
      letter-spacing: 0.06em;
    }

    .hero {
      position: relative;
      min-height: 0;
      border-radius: 34px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 209, 102, 0.18), transparent 28%),
        radial-gradient(circle at 24% 18%, rgba(93, 169, 233, 0.12), transparent 22%),
        radial-gradient(circle at 76% 22%, rgba(255, 158, 109, 0.12), transparent 22%),
        linear-gradient(180deg, rgba(18, 21, 35, 0.7), rgba(12, 14, 24, 0.84));
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 26px 60px -34px var(--shadow);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 28%),
        linear-gradient(0deg, rgba(255, 255, 255, 0.04), transparent 24%);
      pointer-events: none;
      z-index: 1;
    }

    .sky {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .sky::before,
    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sky::before {
      background:
        radial-gradient(circle at 20% 30%, rgba(93, 169, 233, 0.2), transparent 24%),
        radial-gradient(circle at 78% 28%, rgba(255, 158, 109, 0.18), transparent 22%),
        radial-gradient(circle at 58% 18%, rgba(139, 107, 232, 0.18), transparent 26%);
      filter: blur(26px);
      animation: slowShift 16s ease-in-out infinite alternate;
    }

    .sky::after {
      background:
        linear-gradient(180deg, rgba(124, 96, 217, 0.08), transparent 22%),
        linear-gradient(180deg, transparent 46%, rgba(255, 158, 109, 0.08) 100%);
      mix-blend-mode: screen;
    }

    .fog {
      position: absolute;
      inset: auto -10% -6% -10%;
      height: 40%;
      background:
        radial-gradient(circle at 18% 40%, rgba(93, 169, 233, 0.22), transparent 26%),
        radial-gradient(circle at 52% 50%, rgba(139, 107, 232, 0.24), transparent 28%),
        radial-gradient(circle at 80% 42%, rgba(255, 158, 109, 0.18), transparent 24%);
      filter: blur(38px);
      opacity: 0.9;
      animation: fogFlow 14s ease-in-out infinite alternate;
      z-index: 1;
    }

    .mountains,
    .mountains::before,
    .mountains::after {
      position: absolute;
      inset: auto 0 0 0;
      height: 42%;
      pointer-events: none;
    }

    .mountains {
      background:
        linear-gradient(180deg, transparent, rgba(17, 20, 34, 0.74)),
        radial-gradient(circle at 12% 70%, rgba(63, 81, 126, 0.55), transparent 26%),
        radial-gradient(circle at 42% 76%, rgba(81, 63, 134, 0.62), transparent 28%),
        radial-gradient(circle at 74% 74%, rgba(113, 78, 95, 0.58), transparent 24%);
      z-index: 1;
      filter: blur(0.5px);
    }

    .mountains::before {
      content: "";
      height: 74%;
      background:
        radial-gradient(circle at 18% 100%, rgba(58, 73, 116, 0.62), transparent 34%),
        radial-gradient(circle at 54% 100%, rgba(79, 58, 127, 0.72), transparent 36%),
        radial-gradient(circle at 85% 100%, rgba(117, 72, 88, 0.66), transparent 30%);
      filter: blur(16px);
      opacity: 0.9;
    }

    .mountains::after {
      content: "";
      inset: auto 8% 12% 8%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
      opacity: 0.32;
    }

    .floating-shards,
    .particles,
    .char-fragments,
    .dropline {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .floating-shards span,
    .particles span,
    .char-fragments span {
      position: absolute;
      display: block;
    }

    .floating-shards span {
      width: var(--size);
      height: var(--size);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.05)),
        linear-gradient(135deg, var(--c1), var(--c2));
      clip-path: polygon(50% 0%, 100% 34%, 76% 100%, 18% 90%, 0% 36%);
      opacity: 0.8;
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.12));
      animation: shardFloat var(--dur) ease-in-out infinite;
    }

    .particles span {
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.1) 70%, transparent 72%);
      box-shadow: 0 0 18px var(--glow);
      opacity: 0.75;
      animation: sparkle var(--dur) linear infinite;
    }

    .char-fragments span {
      color: rgba(241, 237, 255, 0.5);
      font: 700 var(--size) / 1 var(--font-display);
      text-shadow: 0 0 18px var(--glow);
      animation: glyphDrift var(--dur) ease-in-out infinite;
    }

    .viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }

    .world-track {
      position: absolute;
      inset: 0;
      width: 300%;
      display: flex;
      transform: translateX(calc(var(--camera-x) * -1));
      transition: transform 900ms cubic-bezier(.2, .72, .12, 1);
    }

    .realm {
      position: relative;
      flex: 0 0 33.333333%;
      min-width: 0;
      overflow: hidden;
    }

    .realm::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, var(--realm-glow), transparent 58%);
      filter: blur(26px);
      opacity: 0.84;
      pointer-events: none;
    }

    .realm::after {
      content: "";
      position: absolute;
      inset: auto 18% 10% 18%;
      height: 18%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 68%);
      filter: blur(18px);
      pointer-events: none;
    }

    .realm-inner {
      position: absolute;
      inset: 0;
    }

    .realm.stage1 {
      --realm-glow: rgba(255, 167, 99, 0.28);
      --accent: #ff9e6d;
      --accent-2: #ffd166;
    }

    .realm.stage2 {
      --realm-glow: rgba(103, 139, 255, 0.28);
      --accent: #5da9e9;
      --accent-2: #8b6be8;
    }

    .realm.stage3 {
      --realm-glow: rgba(255, 113, 90, 0.24);
      --accent: #ff8f62;
      --accent-2: #ffcf70;
    }

    .world-structure {
      position: absolute;
      left: 50%;
      top: 49%;
      width: min(34vw, 470px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.28));
    }

    .world-structure .core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.58), transparent 18%),
        radial-gradient(circle at 50% 46%, rgba(255, 209, 102, 0.22), transparent 32%),
        radial-gradient(circle at 50% 58%, var(--accent), transparent 54%);
      filter: blur(4px);
      opacity: 0.76;
      animation: slowRotate 18s linear infinite;
    }

    .world-structure .island {
      position: absolute;
      inset: 22% 18% 20% 18%;
      border-radius: 46% 54% 48% 52% / 52% 48% 56% 44%;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 255, 255, 0.42), transparent 18%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), transparent 24%),
        linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        inset 0 -18px 24px rgba(0, 0, 0, 0.18),
        0 0 40px -10px var(--realm-glow);
      animation: islandPulse 8s ease-in-out infinite;
    }

    .world-structure .underside {
      position: absolute;
      inset: 50% 29% 10% 29%;
      border-radius: 50% 50% 60% 60%;
      background: linear-gradient(180deg, rgba(60, 28, 48, 0.46), rgba(18, 13, 23, 0.76));
      filter: blur(0.4px);
    }

    .world-structure .ring {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 28px -12px var(--realm-glow);
      animation: slowRotate 22s linear infinite reverse;
    }

    .world-structure .ring::before,
    .world-structure .ring::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      inset: 14%;
      border: 1px dashed rgba(255, 255, 255, 0.12);
    }

    .world-structure .tree {
      position: absolute;
      left: 50%;
      top: 28%;
      width: 34%;
      height: 36%;
      transform: translateX(-50%);
    }

    .world-structure .trunk {
      position: absolute;
      left: 44%;
      bottom: 0;
      width: 12%;
      height: 48%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 241, 194, 0.94), rgba(255, 158, 109, 0.7));
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.24);
    }

    .world-structure .canopy {
      position: absolute;
      left: 50%;
      top: 0;
      width: 100%;
      height: 74%;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 255, 255, 0.42), transparent 16%),
        radial-gradient(circle at 34% 50%, rgba(255, 209, 102, 0.78), transparent 26%),
        radial-gradient(circle at 64% 56%, rgba(255, 158, 109, 0.72), transparent 28%),
        radial-gradient(circle at 50% 56%, rgba(89, 217, 194, 0.42), transparent 34%);
      filter: blur(2px);
      box-shadow: 0 0 30px rgba(255, 185, 112, 0.18);
      animation: canopyBreathe 7s ease-in-out infinite;
    }

    .stage2 .world-structure .tree .canopy {
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 255, 255, 0.42), transparent 16%),
        radial-gradient(circle at 34% 50%, rgba(93, 169, 233, 0.76), transparent 26%),
        radial-gradient(circle at 64% 56%, rgba(139, 107, 232, 0.8), transparent 28%),
        radial-gradient(circle at 50% 56%, rgba(89, 217, 194, 0.42), transparent 34%);
      box-shadow: 0 0 30px rgba(129, 150, 255, 0.22);
    }

    .stage3 .world-structure .tree .canopy {
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 255, 255, 0.42), transparent 16%),
        radial-gradient(circle at 34% 50%, rgba(255, 143, 98, 0.78), transparent 26%),
        radial-gradient(circle at 64% 56%, rgba(255, 209, 102, 0.8), transparent 28%),
        radial-gradient(circle at 50% 56%, rgba(171, 76, 98, 0.42), transparent 34%);
      box-shadow: 0 0 30px rgba(255, 147, 103, 0.22);
    }

    .platform-cluster span {
      position: absolute;
      display: block;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.06)),
        linear-gradient(135deg, var(--c1), var(--c2));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        0 12px 22px -14px rgba(0, 0, 0, 0.42),
        0 0 24px -14px var(--glow);
      animation: platformDrift var(--dur) ease-in-out infinite;
    }

    .platform-cluster span::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .hero-orb {
      position: absolute;
      left: 50%;
      bottom: 22%;
      width: clamp(38px, 4vw, 62px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.96), transparent 18%),
        radial-gradient(circle at 42% 46%, rgba(214, 240, 255, 0.72), transparent 28%),
        radial-gradient(circle at 62% 64%, rgba(155, 123, 255, 0.58), transparent 32%),
        linear-gradient(135deg, var(--hero-a), var(--hero-b));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.46),
        inset 0 -10px 18px rgba(49, 27, 109, 0.28),
        0 0 28px rgba(123, 174, 255, 0.42),
        0 18px 28px -16px rgba(0, 0, 0, 0.36);
      animation: orbBounce 4.8s ease-in-out infinite;
      z-index: 4;
    }

    .hero-orb::before,
    .hero-orb::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-orb::before {
      inset: 8% 8% 8% 8%;
      background:
        radial-gradient(circle at 40% 36%, rgba(255, 255, 255, 0.82), transparent 26%),
        radial-gradient(circle at 58% 58%, rgba(89, 217, 194, 0.28), transparent 38%);
      mix-blend-mode: screen;
      animation: orbEnergy 6.4s linear infinite;
    }

    .hero-orb::after {
      inset: -18%;
      background: radial-gradient(circle, rgba(214, 240, 255, 0.34), transparent 60%);
      filter: blur(10px);
      animation: orbAura 4.8s ease-in-out infinite;
    }

    .trail {
      position: absolute;
      left: calc(50% - 84px);
      bottom: calc(22% + 8px);
      width: 86px;
      height: 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(123, 166, 255, 0), rgba(155, 123, 255, 0.4), rgba(214, 240, 255, 0.12));
      filter: blur(10px);
      opacity: 0.66;
      animation: trailWave 4.8s ease-in-out infinite;
      z-index: 3;
    }

    .title-panel {
      position: absolute;
      left: 28px;
      top: 28px;
      width: min(420px, calc(100% - 56px));
      padding: 22px 22px 18px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(28, 31, 51, 0.76), rgba(18, 20, 34, 0.62));
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 0 30px 50px -38px var(--shadow);
      backdrop-filter: blur(18px);
      z-index: 5;
    }

    .title-panel .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(232, 229, 255, 0.76);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .title-panel h1 {
      margin: 16px 0 10px;
      font-size: clamp(42px, 7vw, 78px);
      line-height: 0.9;
      letter-spacing: 0.12em;
      color: var(--white);
      text-shadow:
        0 0 18px rgba(214, 240, 255, 0.14),
        0 0 38px rgba(139, 107, 232, 0.18);
    }

    .title-panel p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.7;
      max-width: 34ch;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .cta,
    .ghost {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--white);
      font: 600 13px/1 var(--font-body);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 220ms ease, filter 220ms ease, box-shadow 220ms ease;
    }

    .cta {
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      box-shadow: 0 16px 26px -18px rgba(255, 181, 95, 0.6);
    }

    .ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .cta:hover,
    .ghost:hover,
    .cta:focus-visible,
    .ghost:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .chapter-card {
      position: absolute;
      right: 28px;
      top: 28px;
      width: min(320px, calc(100% - 56px));
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(28, 31, 51, 0.74), rgba(18, 20, 34, 0.62));
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 0 30px 50px -38px var(--shadow);
      backdrop-filter: blur(18px);
      z-index: 5;
    }

    .chapter-card small {
      display: block;
      color: rgba(232, 229, 255, 0.54);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 11px;
    }

    .chapter-card h2 {
      margin: 10px 0 8px;
      font-size: 24px;
      color: var(--white);
      letter-spacing: 0.05em;
    }

    .chapter-card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .chapter-tags {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chapter-tags span {
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--white);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stage-nav {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      width: min(880px, calc(100% - 36px));
      padding: 14px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(29, 32, 52, 0.8), rgba(17, 19, 33, 0.72));
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 0 28px 48px -36px var(--shadow);
      backdrop-filter: blur(18px);
      z-index: 6;
    }

    .stage-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 6px 12px;
    }

    .stage-nav-header strong {
      color: rgba(241, 238, 255, 0.92);
      letter-spacing: 0.14em;
      font-size: 12px;
      text-transform: uppercase;
    }

    .stage-nav-header span {
      color: rgba(232, 229, 255, 0.62);
      font-size: 12px;
    }

    .stage-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stage-node {
      position: relative;
      min-height: 108px;
      border: 0;
      border-radius: 22px;
      text-align: left;
      padding: 16px 16px 14px;
      color: var(--white);
      cursor: pointer;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 14%, rgba(255, 255, 255, 0.24), transparent 22%),
        linear-gradient(135deg, var(--node-a), var(--node-b));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 16px 30px -18px rgba(0, 0, 0, 0.38);
      transition: transform 220ms ease, box-shadow 220ms ease, filter 220ms ease;
    }

    .stage-node::before {
      content: "";
      position: absolute;
      inset: auto -18% -54% auto;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      filter: blur(14px);
      opacity: 0.9;
    }

    .stage-node::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      opacity: 0.72;
    }

    .stage-node:hover,
    .stage-node:focus-visible {
      transform: translateY(-3px);
      filter: brightness(1.06);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        0 22px 36px -18px rgba(0, 0, 0, 0.42);
    }

    .stage-node.active {
      transform: translateY(-4px) scale(1.01);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        0 24px 40px -16px rgba(0, 0, 0, 0.44),
        0 0 36px -16px var(--node-glow);
    }

    .stage-node small,
    .stage-node strong,
    .stage-node span {
      position: relative;
      z-index: 1;
      display: block;
    }

    .stage-node small {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.74);
    }

    .stage-node strong {
      margin-top: 6px;
      font-size: 22px;
      letter-spacing: 0.04em;
    }

    .stage-node span {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.82);
      max-width: 20ch;
    }

    .dropline {
      z-index: 7;
      overflow: hidden;
    }

    .falling-rune {
      position: absolute;
      top: -10%;
      left: var(--x);
      width: 72px;
      height: 72px;
      margin-left: -36px;
      display: grid;
      place-items: center;
      color: var(--white);
      font: 700 34px/1 var(--font-display);
      border-radius: 22px;
      background:
        radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.26), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03)),
        var(--tone);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 14px 28px -14px rgba(0, 0, 0, 0.36),
        0 0 40px -12px var(--glow);
      animation:
        runeFall 3.8s cubic-bezier(.22, .74, .16, 1) forwards,
        runeSpin 3.8s ease-in-out forwards;
    }

    .falling-rune::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      animation: runeRipple 1.6s ease-out infinite;
    }

    .footer {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      z-index: 5;
    }

    .pulse {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(232, 229, 255, 0.72);
      font-size: 12px;
      backdrop-filter: blur(18px);
    }

    .pulse::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 14px rgba(93, 169, 233, 0.64);
      animation: blink 2.2s ease-in-out infinite;
    }

    .footer-text {
      color: rgba(232, 229, 255, 0.54);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }

    .orbital {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(232, 229, 255, 0.72);
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
    }

    .orbital strong {
      color: var(--white);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .error-state {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: linear-gradient(180deg, #141624, #1a1d2c);
      color: var(--white);
      font-family: var(--font-body);
    }

    .error-state p {
      margin: 0;
      padding: 18px 22px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 18px 34px -28px var(--shadow);
    }

    @keyframes slowShift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 2%, 0) scale(1.06); }
    }

    @keyframes fogFlow {
      from { transform: translateX(-2%) translateY(0); }
      to { transform: translateX(3%) translateY(-5%); }
    }

    @keyframes shardFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(8deg); }
    }

    @keyframes sparkle {
      0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
      20% { opacity: 0.78; }
      100% { transform: translate3d(var(--dx), var(--dy), 0) scale(1.3); opacity: 0; }
    }

    @keyframes glyphDrift {
      0%, 100% { transform: translateY(0) rotate(-4deg); opacity: 0.3; }
      50% { transform: translateY(-14px) rotate(4deg); opacity: 0.62; }
    }

    @keyframes platformDrift {
      0%, 100% { transform: translateY(0) rotate(var(--rot)); }
      50% { transform: translateY(-10px) rotate(calc(var(--rot) + 1.5deg)); }
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes islandPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes canopyBreathe {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.03); }
    }

    @keyframes orbBounce {
      0%, 100% { transform: translateX(-50%) translateY(0) scale(1, 1); }
      35% { transform: translateX(-50%) translateY(-12px) scale(1.05, 0.96); }
      60% { transform: translateX(-50%) translateY(-6px) scale(0.98, 1.03); }
    }

    @keyframes orbEnergy {
      from { transform: rotate(0deg) scale(1); }
      to { transform: rotate(360deg) scale(1.02); }
    }

    @keyframes orbAura {
      0%, 100% { opacity: 0.58; transform: scale(0.96); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }

    @keyframes trailWave {
      0%, 100% { opacity: 0.36; transform: scaleX(0.82); }
      50% { opacity: 0.82; transform: scaleX(1); }
    }

    @keyframes runeHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes runePulse {
      0% { opacity: 0.18; transform: scale(0.92); }
      100% { opacity: 0; transform: scale(1.18); }
    }

    @keyframes runeFall {
      0% { transform: translateY(0) scale(0.88); opacity: 0; }
      14% { opacity: 1; }
      80% { transform: translateY(72vh) scale(1.02); opacity: 1; }
      100% { transform: translateY(88vh) scale(0.96); opacity: 0; }
    }

    @keyframes runeSpin {
      0% { rotate: -12deg; }
      50% { rotate: 8deg; }
      100% { rotate: -2deg; }
    }

    @keyframes runeRipple {
      from { opacity: 0.46; transform: scale(0.9); }
      to { opacity: 0; transform: scale(1.16); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @media (max-width: 1080px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .runes {
        justify-self: start;
      }

      .status {
        justify-self: start;
      }

      .title-panel,
      .chapter-card {
        width: min(340px, calc(100% - 40px));
      }

      .world-structure {
        width: min(46vw, 420px);
      }
    }

    @media (max-width: 840px) {
      .shell {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero {
        border-radius: 28px;
      }

      .title-panel {
        top: 18px;
        left: 18px;
        padding: 18px;
      }

      .chapter-card {
        top: auto;
        right: 18px;
        bottom: 154px;
      }

      .stage-nav {
        bottom: 18px;
        width: calc(100% - 24px);
      }

      .stage-list {
        gap: 10px;
      }

      .stage-node {
        min-height: 98px;
        padding: 14px;
      }

      .footer {
        grid-template-columns: 1fr;
        justify-items: start;
      }

      .footer-text {
        text-align: left;
      }

      .orbital {
        justify-self: start;
      }
    }

    @media (max-width: 700px) {
      .hero {
        min-height: 68vh;
      }

      .title-panel {
        width: calc(100% - 36px);
      }

      .chapter-card {
        left: 18px;
        right: 18px;
        width: auto;
        bottom: 190px;
      }

      .world-structure {
        width: min(66vw, 360px);
        top: 52%;
      }

      .stage-list {
        grid-template-columns: 1fr;
      }

      .stage-node span {
        max-width: none;
      }

      .hero-orb {
        bottom: 20%;
      }
    }

    @media (max-width: 520px) {
      .shell {
        gap: 10px;
      }

      .brand strong {
        font-size: 28px;
      }

      .runes {
        padding: 8px 10px;
        gap: 8px;
      }

      .rune {
        width: 50px;
        height: 50px;
        font-size: 24px;
      }

      .title-panel h1 {
        font-size: 42px;
      }

      .title-panel p,
      .chapter-card p {
        font-size: 12px;
      }

      .chapter-card {
        bottom: 206px;
      }

      .stage-nav-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .badge {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app" aria-label="&#35328;&#28789; dreamworld home"></div>
  <script>
    (function () {
      try {
        var app = document.getElementById("app");

        var stageData = [
          {
            id: 0,
            stage: "Stage 1",
            title: "\u6686\u5149\u68ee\u68a6",
            subtitle: "Warm Forest Dream",
            desc: "\u6696\u6a59\u8272\u68ee\u6797\u7cfb\u4e16\u754c\uff0c\u6f02\u6d6e\u6728\u53f0\u3001\u53d1\u5149\u690d\u7269\u3001\u53ef\u88ab\u6c49\u5b57\u6539\u5199\u7684\u67d4\u8f6f\u7269\u7406\u89c4\u5219\u3002",
            tags: ["Forest Glow", "Warm Magic", "Soft Physics"],
            nodeA: "#ff9e6d",
            nodeB: "#ffd166",
            glow: "rgba(255, 186, 112, 0.5)"
          },
          {
            id: 1,
            stage: "Stage 2",
            title: "\u84dd\u7d2b\u6d6e\u754c",
            subtitle: "Azure Floating Veil",
            desc: "\u68a6\u5883\u84dd\u7d2b\u7a7a\u95f4\uff0c\u6c34\u6676\u3001\u661f\u96fe\u3001\u88ab\u8bed\u8a00\u6258\u4e3e\u7684\u6f02\u6d6e\u9053\u8def\uff0c\u6c14\u8d28\u66f4\u5e7d\u6df1\u3002",
            tags: ["Crystal Drift", "Blue Void", "Rune Echo"],
            nodeA: "#5da9e9",
            nodeB: "#8b6be8",
            glow: "rgba(123, 145, 255, 0.52)"
          },
          {
            id: 2,
            stage: "Stage 3",
            title: "\u708e\u6d6a\u626d\u57df",
            subtitle: "Twisted Ember Realm",
            desc: "\u7ea2\u6a59\u8272\u626d\u66f2\u4e16\u754c\uff0c\u7a7a\u95f4\u88ab\u70ed\u91cf\u4e0e\u8bed\u8a00\u6495\u626f\uff0c\u5e73\u53f0\u50cf\u71c3\u70e7\u7684\u8bd7\u53e5\u4e00\u6837\u6d6a\u52a8\u3002",
            tags: ["Ember Tide", "Shifting Space", "Fire Script"],
            nodeA: "#ff8f62",
            nodeB: "#ffcf70",
            glow: "rgba(255, 160, 96, 0.5)"
          }
        ];

        var runes = [
          { text: "\u706b", tone: "linear-gradient(135deg, #ff7d67, #ffb166)", glow: "rgba(255, 145, 93, 0.62)" },
          { text: "\u8f7b", tone: "linear-gradient(135deg, #59d9c2, #88f0d7)", glow: "rgba(89, 217, 194, 0.56)" },
          { text: "\u5206", tone: "linear-gradient(135deg, #8b6be8, #bf7bff)", glow: "rgba(165, 123, 255, 0.58)" },
          { text: "\u51b0", tone: "linear-gradient(135deg, #5da9e9, #8dd8ff)", glow: "rgba(125, 205, 255, 0.56)" }
        ];

        app.innerHTML = [
          '<main class="shell">',
          '  <header class="topbar">',
          '    <div class="brand"><small>Indie Puzzle Platformer</small><strong>&#35328;&#28789;</strong></div>',
          '    <div class="runes" id="runeBar" aria-label="Rule runes"></div>',
          '    <div class="status">',
          '      <div class="badge"><span>Current Focus</span><strong id="focusStage">Stage 1</strong></div>',
          '      <div class="badge"><span>Dream Rules</span><strong>4 Glyphs</strong></div>',
          '    </div>',
          '  </header>',
          '  <section class="hero">',
          '    <div class="sky"></div>',
          '    <div class="fog"></div>',
          '    <div class="mountains"></div>',
          '    <div class="floating-shards" id="shards"></div>',
          '    <div class="particles" id="particles"></div>',
          '    <div class="char-fragments" id="charFragments"></div>',
          '    <div class="viewport">',
          '      <div class="world-track" id="worldTrack"></div>',
          '    </div>',
          '    <div class="title-panel">',
          '      <span class="eyebrow">Dream rules are written in words</span>',
          '      <h1>&#35328;&#28789;</h1>',
          '      <p>&#29992;&#27721;&#23383;&#25913;&#20889;&#26790;&#22659;&#7269;&#29702;&#30340; 2D &#21019;&#24847;&#35299;&#35868;&#28216;&#25103;&#12290;&#39318;&#39029;&#19981;&#26159;&#33756;&#21333;&#65292;&#32780;&#26159;&#19968;&#20010;&#27963;&#30528;&#30340;&#28418;&#28014;&#19990;&#30028;&#12290;</p>',
          '      <div class="actions">',
          '        <button class="cta" type="button" id="enterBtn">Enter Dream</button>',
          '        <button class="ghost" type="button" id="cycleBtn">Shift Realm</button>',
          '      </div>',
          '    </div>',
          '    <aside class="chapter-card" id="chapterCard">',
          '      <small>Realm Preview</small>',
          '      <h2 id="chapterTitle"></h2>',
          '      <p id="chapterDesc"></p>',
          '      <div class="chapter-tags" id="chapterTags"></div>',
          '    </aside>',
          '    <div class="stage-nav">',
          '      <div class="stage-nav-header">',
          '        <strong>Dream Stages</strong>',
          '        <span>&#28857;&#20987;&#28418;&#28014;&#33410;&#28857;&#65292;&#38236;&#22836;&#20250;&#24179;&#28369;&#31227;&#21521;&#23545;&#24212;&#26790;&#22659;&#21306;&#22495;</span>',
          '      </div>',
          '      <div class="stage-list" id="stageList"></div>',
          '    </div>',
          '    <div class="dropline" id="dropline"></div>',
          '  </section>',
          '  <footer class="footer">',
          '    <div class="pulse">Living world / floating particles / glowing glyphs</div>',
          '    <div class="footer-text">Hackathon-ready homepage concept / deep color / dreamlike platformer mood</div>',
          '    <div class="orbital"><strong>Hero Form</strong><span>Ling Orb</span></div>',
          '  </footer>',
          '</main>'
        ].join("");

        var root = document.documentElement;
        var worldTrack = document.getElementById("worldTrack");
        var stageList = document.getElementById("stageList");
        var chapterTitle = document.getElementById("chapterTitle");
        var chapterDesc = document.getElementById("chapterDesc");
        var chapterTags = document.getElementById("chapterTags");
        var focusStage = document.getElementById("focusStage");
        var dropline = document.getElementById("dropline");
        var runeBar = document.getElementById("runeBar");
        var cycleBtn = document.getElementById("cycleBtn");
        var enterBtn = document.getElementById("enterBtn");
        var currentStage = 0;

        buildRunes();
        buildAmbient();
        buildWorlds();
        buildStageNodes();
        setStage(0);

        cycleBtn.addEventListener("click", function () {
          setStage((currentStage + 1) % stageData.length);
        });

        enterBtn.addEventListener("click", function () {
          spawnRune(runes[currentStage % runes.length], 50);
        });

        function buildRunes() {
          runes.forEach(function (rune, index) {
            var button = document.createElement("button");
            button.className = "rune";
            button.type = "button";
            button.textContent = rune.text;
            button.style.setProperty("--tone", rune.tone);
            button.style.setProperty("--glow", rune.glow);
            button.setAttribute("aria-label", "Rune " + rune.text);
            button.addEventListener("click", function () {
              button.classList.remove("active");
              void button.offsetWidth;
              button.classList.add("active");
              spawnRune(rune, 20 + index * 18 + Math.random() * 8);
            });
            runeBar.appendChild(button);
          });
        }

        function buildAmbient() {
          fillShards(document.getElementById("shards"));
          fillParticles(document.getElementById("particles"));
          fillChars(document.getElementById("charFragments"));
        }

        function buildWorlds() {
          stageData.forEach(function (stage, index) {
            var realm = document.createElement("section");
            realm.className = "realm stage" + (index + 1);
            realm.innerHTML = [
              '<div class="realm-inner">',
              '  <div class="platform-cluster">',
              '    <span style="left:18%; top:56%; width:18%; height:18px; --c1:' + stage.nodeA + '; --c2:' + stage.nodeB + '; --dur:7.4s; --rot:-8deg;"></span>',
              '    <span style="left:64%; top:44%; width:14%; height:16px; --c1:' + stage.nodeB + '; --c2:' + stage.nodeA + '; --dur:6.6s; --rot:10deg;"></span>',
              '    <span style="left:56%; top:66%; width:12%; height:14px; --c1:' + stage.nodeA + '; --c2:' + stage.nodeB + '; --dur:8.2s; --rot:6deg;"></span>',
              '    <span style="left:32%; top:34%; width:16%; height:16px; --c1:' + stage.nodeB + '; --c2:' + stage.nodeA + '; --dur:7.8s; --rot:-4deg;"></span>',
              '  </div>',
              '  <div class="world-structure">',
              '    <div class="core"></div>',
              '    <div class="ring"></div>',
              '    <div class="island"></div>',
              '    <div class="underside"></div>',
              '    <div class="tree"><div class="canopy"></div><div class="trunk"></div></div>',
              '  </div>',
              '  <div class="trail"></div>',
              '  <div class="hero-orb"></div>',
              '</div>'
            ].join("");
            worldTrack.appendChild(realm);
          });
        }

        function buildStageNodes() {
          stageData.forEach(function (stage) {
            var button = document.createElement("button");
            button.className = "stage-node";
            button.type = "button";
            button.dataset.stage = String(stage.id);
            button.style.setProperty("--node-a", stage.nodeA);
            button.style.setProperty("--node-b", stage.nodeB);
            button.style.setProperty("--node-glow", stage.glow);
            button.innerHTML = [
              '<small>' + stage.stage + '</small>',
              '<strong>' + stage.title + '</strong>',
              '<span>' + stage.subtitle + '</span>'
            ].join("");
            button.addEventListener("click", function () {
              setStage(stage.id);
            });
            stageList.appendChild(button);
          });
        }

        function setStage(index) {
          currentStage = index;
          root.style.setProperty("--camera-x", String(index * 100));
          var stage = stageData[index];
          chapterTitle.textContent = stage.title;
          chapterDesc.textContent = stage.desc;
          focusStage.textContent = stage.stage;
          chapterTags.innerHTML = "";
          stage.tags.forEach(function (tag) {
            var chip = document.createElement("span");
            chip.textContent = tag;
            chapterTags.appendChild(chip);
          });

          var buttons = stageList.querySelectorAll(".stage-node");
          buttons.forEach(function (button) {
            button.classList.toggle("active", Number(button.dataset.stage) === index);
          });
        }

        function spawnRune(rune, percentX) {
          var glyph = document.createElement("div");
          glyph.className = "falling-rune";
          glyph.textContent = rune.text;
          glyph.style.setProperty("--x", percentX + "%");
          glyph.style.setProperty("--tone", rune.tone);
          glyph.style.setProperty("--glow", rune.glow);
          dropline.appendChild(glyph);
          window.setTimeout(function () {
            if (glyph.parentNode) {
              glyph.parentNode.removeChild(glyph);
            }
          }, 3800);
        }

        function fillShards(container) {
          var colors = [
            ["#ff9e6d", "#ffd166"],
            ["#5da9e9", "#8b6be8"],
            ["#59d9c2", "#5da9e9"],
            ["#ff8f62", "#8b6be8"]
          ];

          for (var i = 0; i < 14; i += 1) {
            var shard = document.createElement("span");
            var pair = colors[i % colors.length];
            shard.style.left = 6 + i * 6.5 + "%";
            shard.style.top = 10 + (i % 5) * 12 + "%";
            shard.style.setProperty("--size", 14 + (i % 4) * 8 + "px");
            shard.style.setProperty("--c1", pair[0]);
            shard.style.setProperty("--c2", pair[1]);
            shard.style.setProperty("--dur", 5.4 + (i % 6) * 0.8 + "s");
            container.appendChild(shard);
          }
        }

        function fillParticles(container) {
          for (var i = 0; i < 28; i += 1) {
            var p = document.createElement("span");
            p.style.left = Math.random() * 100 + "%";
            p.style.top = 18 + Math.random() * 62 + "%";
            p.style.setProperty("--size", 3 + Math.random() * 5 + "px");
            p.style.setProperty("--dur", 4 + Math.random() * 7 + "s");
            p.style.setProperty("--dx", (-20 + Math.random() * 40) + "px");
            p.style.setProperty("--dy", (-80 - Math.random() * 70) + "px");
            p.style.setProperty("--glow", ["rgba(255, 209, 102, 0.38)", "rgba(125, 205, 255, 0.34)", "rgba(163, 123, 255, 0.34)"][i % 3]);
            container.appendChild(p);
          }
        }

        function fillChars(container) {
          var chars = ["\u706b", "\u8f7b", "\u5206", "\u51b0", "\u98ce", "\u68a6", "\u5f71", "\u5149"];
          for (var i = 0; i < chars.length; i += 1) {
            var g = document.createElement("span");
            g.textContent = chars[i];
            g.style.left = 10 + i * 10 + "%";
            g.style.top = 12 + (i % 4) * 15 + "%";
            g.style.setProperty("--size", 18 + (i % 3) * 10 + "px");
            g.style.setProperty("--dur", 6 + i * 0.7 + "s");
            g.style.setProperty("--glow", ["rgba(255, 158, 109, 0.2)", "rgba(93, 169, 233, 0.2)", "rgba(139, 107, 232, 0.22)"][i % 3]);
            container.appendChild(g);
          }
        }

        window.setInterval(function () {
          var rune = runes[Math.floor(Math.random() * runes.length)];
          spawnRune(rune, 18 + Math.random() * 64);
        }, 2800);
      } catch (error) {
        document.body.innerHTML = '<div class="error-state"><p>&#21734;&#21680;&#65292;&#20986;&#38169;&#20102;&#65292;&#35831;&#37325;&#21551;&#35797;&#35797;&#21543;~</p></div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
