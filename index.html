<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>&#35328;&#28789; | Floating Dreamworld</title>
  <style>
    :root {
      --bg0: #151725;
      --bg1: #1d2033;
      --bg2: #282847;
      --white: #f7f3ff;
      --ink: #e8e1ff;
      --ink-soft: rgba(232, 225, 255, 0.76);
      --line: rgba(255, 255, 255, 0.12);
      --shadow: rgba(0, 0, 0, 0.42);
      --orange: #ff9e6d;
      --blue: #5da9e9;
      --purple: #8b6be8;
      --cyan: #59d9c2;
      --yellow: #ffd166;
      --red: #ff7f67;
      --focus-x: 0px;
      --focus-y: 0px;
      --focus-scale: 1;
      --font-display: "Trebuchet MS", "Verdana", sans-serif;
      --font-ui: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 14%, rgba(93, 169, 233, 0.18), transparent 24%),
        radial-gradient(circle at 78% 16%, rgba(255, 158, 109, 0.16), transparent 22%),
        radial-gradient(circle at 50% 0%, rgba(139, 107, 232, 0.24), transparent 28%),
        linear-gradient(180deg, #121423 0%, #171a2a 38%, #131522 100%);
      color: var(--ink);
      font-family: var(--font-ui);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 158, 109, 0.18), transparent 20%),
        radial-gradient(circle at 82% 24%, rgba(89, 217, 194, 0.14), transparent 18%),
        radial-gradient(circle at 54% 8%, rgba(139, 107, 232, 0.24), transparent 28%);
      filter: blur(34px);
      animation: bgDrift 18s ease-in-out infinite alternate;
    }

    body::after {
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.26) 0.65px, transparent 0.7px),
        radial-gradient(rgba(255, 255, 255, 0.14) 0.55px, transparent 0.6px);
      background-size: 110px 110px, 68px 68px;
      background-position: 0 0, 22px 38px;
      opacity: 0.18;
      mix-blend-mode: screen;
    }

    #app {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      z-index: 1;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)) 18px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      position: relative;
      z-index: 8;
    }

    .top-info {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 12px 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(32, 35, 58, 0.8), rgba(21, 24, 40, 0.66));
      border: 1px solid var(--line);
      box-shadow: 0 18px 40px -30px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .chip span {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(232, 225, 255, 0.54);
    }

    .chip strong {
      display: block;
      margin-top: 4px;
      color: var(--white);
      font-size: 15px;
      letter-spacing: 0.06em;
    }

    .runes {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(34, 37, 62, 0.76), rgba(20, 22, 37, 0.66));
      border: 1px solid var(--line);
      box-shadow: 0 22px 48px -34px var(--shadow);
      backdrop-filter: blur(20px);
    }

    .rune {
      position: relative;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--white);
      font: 700 28px/1 var(--font-display);
      background:
        radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.28), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03)),
        var(--tone);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 10px 24px -12px rgba(0, 0, 0, 0.34),
        0 0 28px -10px var(--glow);
      cursor: pointer;
      transition: transform 220ms ease, filter 220ms ease, box-shadow 220ms ease;
      animation: softBob 5.5s ease-in-out infinite;
    }

    .rune:hover,
    .rune:focus-visible,
    .rune.active {
      transform: translateY(-3px) scale(1.04);
      filter: brightness(1.08);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        0 16px 30px -12px rgba(0, 0, 0, 0.38),
        0 0 42px -8px var(--glow);
    }

    .hero {
      position: relative;
      min-height: 0;
      border-radius: 34px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 209, 102, 0.16), transparent 24%),
        radial-gradient(circle at 22% 20%, rgba(93, 169, 233, 0.12), transparent 22%),
        radial-gradient(circle at 80% 18%, rgba(255, 158, 109, 0.12), transparent 20%),
        linear-gradient(180deg, rgba(15, 18, 31, 0.72), rgba(10, 12, 23, 0.84));
      border: 1px solid var(--line);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 28px 58px -36px var(--shadow);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 26%),
        linear-gradient(0deg, rgba(255, 255, 255, 0.04), transparent 24%);
      z-index: 1;
      pointer-events: none;
    }

    .sky,
    .clouds,
    .mountains,
    .glow-fog,
    .particles,
    .fragments,
    .energy-streams,
    .dropline {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sky::before,
    .sky::after,
    .clouds::before,
    .clouds::after,
    .mountains::before,
    .mountains::after,
    .glow-fog::before,
    .glow-fog::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .sky::before {
      background:
        radial-gradient(circle at 22% 28%, rgba(93, 169, 233, 0.22), transparent 20%),
        radial-gradient(circle at 70% 18%, rgba(139, 107, 232, 0.2), transparent 24%),
        radial-gradient(circle at 78% 34%, rgba(255, 158, 109, 0.18), transparent 18%);
      filter: blur(20px);
      animation: bgDrift 15s ease-in-out infinite alternate;
    }

    .sky::after {
      background:
        linear-gradient(180deg, rgba(88, 79, 168, 0.08), transparent 28%),
        linear-gradient(180deg, transparent 42%, rgba(255, 152, 94, 0.08) 100%);
    }

    .clouds::before {
      inset: 8% -6% auto -6%;
      height: 28%;
      background:
        radial-gradient(circle at 18% 50%, rgba(105, 132, 226, 0.16), transparent 20%),
        radial-gradient(circle at 50% 56%, rgba(142, 102, 226, 0.18), transparent 24%),
        radial-gradient(circle at 82% 44%, rgba(255, 175, 116, 0.16), transparent 18%);
      filter: blur(34px);
      animation: cloudFlow 24s ease-in-out infinite alternate;
    }

    .clouds::after {
      inset: auto -8% 8% -8%;
      height: 24%;
      background:
        radial-gradient(circle at 26% 50%, rgba(89, 217, 194, 0.1), transparent 18%),
        radial-gradient(circle at 56% 54%, rgba(93, 169, 233, 0.12), transparent 18%),
        radial-gradient(circle at 76% 46%, rgba(255, 158, 109, 0.12), transparent 18%);
      filter: blur(30px);
      animation: cloudFlow 18s ease-in-out infinite alternate-reverse;
    }

    .mountains::before {
      inset: auto 0 0 0;
      height: 38%;
      background:
        radial-gradient(circle at 14% 100%, rgba(48, 64, 107, 0.72), transparent 32%),
        radial-gradient(circle at 42% 100%, rgba(75, 53, 124, 0.76), transparent 34%),
        radial-gradient(circle at 76% 100%, rgba(101, 61, 92, 0.68), transparent 30%);
      filter: blur(12px);
      opacity: 0.92;
    }

    .mountains::after {
      inset: auto 8% 10% 8%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent);
      opacity: 0.34;
    }

    .glow-fog::before {
      inset: auto -10% 12% -10%;
      height: 38%;
      background:
        radial-gradient(circle at 18% 50%, rgba(255, 158, 109, 0.16), transparent 24%),
        radial-gradient(circle at 52% 44%, rgba(139, 107, 232, 0.18), transparent 26%),
        radial-gradient(circle at 82% 46%, rgba(93, 169, 233, 0.16), transparent 22%);
      filter: blur(42px);
      animation: fogFlow 16s ease-in-out infinite alternate;
    }

    .glow-fog::after {
      inset: auto 18% 20% 18%;
      height: 18%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 66%);
      filter: blur(18px);
    }

    .particles span,
    .fragments span {
      position: absolute;
      display: block;
    }

    .particles span {
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.12) 68%, transparent 72%);
      box-shadow: 0 0 16px var(--glow);
      opacity: 0.75;
      animation: sparkle var(--dur) linear infinite;
    }

    .fragments span {
      color: rgba(242, 238, 255, 0.44);
      font: 700 var(--size) / 1 var(--font-display);
      text-shadow: 0 0 18px var(--glow);
      animation: glyphFloat var(--dur) ease-in-out infinite;
    }

    .energy-streams svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      opacity: 0.92;
      filter: drop-shadow(0 0 14px rgba(170, 191, 255, 0.16));
    }

    .title-panel,
    .focus-card {
      position: absolute;
      z-index: 8;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(28, 31, 51, 0.76), rgba(16, 18, 31, 0.62));
      border: 1px solid var(--line);
      box-shadow: 0 28px 48px -36px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .title-panel {
      left: 28px;
      top: 28px;
      width: min(420px, calc(100% - 56px));
      padding: 22px 22px 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(232, 225, 255, 0.78);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .title-panel h1 {
      margin: 16px 0 10px;
      font-size: clamp(44px, 7vw, 80px);
      line-height: 0.9;
      letter-spacing: 0.12em;
      color: var(--white);
      text-shadow:
        0 0 20px rgba(214, 240, 255, 0.14),
        0 0 38px rgba(139, 107, 232, 0.18);
    }

    .title-panel p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.7;
      max-width: 34ch;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .cta,
    .ghost {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--white);
      font: 600 13px/1 var(--font-ui);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 220ms ease, filter 220ms ease;
    }

    .cta {
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      box-shadow: 0 16px 26px -18px rgba(255, 181, 95, 0.56);
    }

    .ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .cta:hover,
    .ghost:hover,
    .cta:focus-visible,
    .ghost:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .focus-card {
      right: 28px;
      bottom: 28px;
      width: min(330px, calc(100% - 56px));
      padding: 20px;
    }

    .focus-card small {
      display: block;
      color: rgba(232, 225, 255, 0.54);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 11px;
    }

    .focus-card h2 {
      margin: 10px 0 8px;
      font-size: 25px;
      color: var(--white);
      letter-spacing: 0.05em;
    }

    .focus-card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .tags {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tags span {
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--white);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .world-window {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 3;
    }

    .world-map {
      position: absolute;
      inset: -4% -6% -6% -6%;
      transform: translate3d(var(--focus-x), var(--focus-y), 0) scale(var(--focus-scale));
      transform-origin: center center;
      transition: transform 1100ms cubic-bezier(.2, .72, .12, 1);
    }

    .island {
      position: absolute;
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      z-index: var(--z);
      filter: drop-shadow(0 22px 34px rgba(0, 0, 0, 0.28));
      animation: islandDrift var(--float) ease-in-out infinite;
      transition: transform 360ms ease, filter 360ms ease;
    }

    .island:hover,
    .island:focus-visible,
    .island.active {
      transform: scale(1.04);
      filter: drop-shadow(0 28px 40px rgba(0, 0, 0, 0.34));
      outline: none;
    }

    .island-visual {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .halo {
      position: absolute;
      inset: -10%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow), transparent 62%);
      filter: blur(20px);
      opacity: 0.8;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    .land {
      position: absolute;
      inset: 18% 10% 18% 10%;
      border-radius: 45% 55% 44% 56% / 54% 42% 58% 46%;
      background:
        radial-gradient(circle at 44% 28%, rgba(255, 255, 255, 0.34), transparent 18%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.14), transparent 28%),
        linear-gradient(135deg, var(--top1), var(--top2));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.26),
        inset 0 -18px 24px rgba(0, 0, 0, 0.22),
        0 0 34px -10px var(--glow);
    }

    .underside {
      position: absolute;
      inset: 56% 24% 10% 24%;
      border-radius: 45% 45% 62% 62%;
      background: linear-gradient(180deg, rgba(55, 24, 36, 0.48), rgba(15, 11, 18, 0.82));
      filter: blur(0.4px);
    }

    .detail {
      position: absolute;
      inset: 0;
    }

    .detail span {
      position: absolute;
      display: block;
      pointer-events: none;
    }

    .orb-avatar {
      position: absolute;
      width: clamp(30px, 3vw, 48px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.96), transparent 18%),
        radial-gradient(circle at 44% 46%, rgba(214, 240, 255, 0.72), transparent 28%),
        radial-gradient(circle at 62% 66%, rgba(155, 123, 255, 0.58), transparent 32%),
        linear-gradient(135deg, #7aa6ff, #9b7bff);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.46),
        inset 0 -10px 18px rgba(49, 27, 109, 0.28),
        0 0 28px rgba(123, 174, 255, 0.44),
        0 12px 20px -12px rgba(0, 0, 0, 0.36);
      z-index: 7;
      animation: orbBounce 4.8s ease-in-out infinite;
    }

    .orb-avatar::before,
    .orb-avatar::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-avatar::before {
      inset: 8%;
      background:
        radial-gradient(circle at 40% 36%, rgba(255, 255, 255, 0.82), transparent 26%),
        radial-gradient(circle at 58% 58%, rgba(89, 217, 194, 0.28), transparent 38%);
      animation: orbSpin 6.2s linear infinite;
    }

    .orb-avatar::after {
      inset: -20%;
      background: radial-gradient(circle, rgba(214, 240, 255, 0.34), transparent 60%);
      filter: blur(10px);
      animation: pulseGlow 4.8s ease-in-out infinite;
    }

    .path-highlight {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.92;
    }

    .path-highlight svg {
      width: 100%;
      height: 100%;
    }

    .footer {
      position: relative;
      z-index: 8;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .pulse,
    .orbital {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(232, 225, 255, 0.72);
      font-size: 12px;
      backdrop-filter: blur(18px);
    }

    .pulse::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 14px rgba(93, 169, 233, 0.6);
      animation: blink 2.2s ease-in-out infinite;
      vertical-align: middle;
    }

    .footer-text {
      text-align: center;
      color: rgba(232, 225, 255, 0.54);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .dropline {
      z-index: 9;
      overflow: hidden;
    }

    .falling-rune {
      position: absolute;
      top: -10%;
      left: var(--x);
      width: 72px;
      height: 72px;
      margin-left: -36px;
      display: grid;
      place-items: center;
      color: var(--white);
      font: 700 34px/1 var(--font-display);
      border-radius: 22px;
      background:
        radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.24), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03)),
        var(--tone);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 14px 28px -14px rgba(0, 0, 0, 0.36),
        0 0 40px -12px var(--glow);
      animation:
        runeFall 3.8s cubic-bezier(.22, .74, .16, 1) forwards,
        runeSpin 3.8s ease-in-out forwards;
    }

    .falling-rune::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      animation: runeRipple 1.6s ease-out infinite;
    }

    .error-state {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--white);
      background: linear-gradient(180deg, #141624, #1a1d2c);
      font-family: var(--font-ui);
    }

    .error-state p {
      margin: 0;
      padding: 18px 22px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 18px 34px -28px var(--shadow);
    }

    @keyframes bgDrift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 2%, 0) scale(1.06); }
    }

    @keyframes cloudFlow {
      from { transform: translateX(-2%) translateY(0); }
      to { transform: translateX(3%) translateY(-4%); }
    }

    @keyframes fogFlow {
      from { transform: translateX(-2%) translateY(0); }
      to { transform: translateX(2%) translateY(-5%); }
    }

    @keyframes sparkle {
      0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
      18% { opacity: 0.76; }
      100% { transform: translate3d(var(--dx), var(--dy), 0) scale(1.22); opacity: 0; }
    }

    @keyframes glyphFloat {
      0%, 100% { transform: translateY(0) rotate(-4deg); opacity: 0.32; }
      50% { transform: translateY(-14px) rotate(4deg); opacity: 0.62; }
    }

    @keyframes islandDrift {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.56; transform: scale(0.96); }
      50% { opacity: 0.92; transform: scale(1.08); }
    }

    @keyframes softBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes orbBounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      35% { transform: translateY(-10px) scale(1.05, 0.96); }
      60% { transform: translateY(-4px) scale(0.98, 1.03); }
    }

    @keyframes orbSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes runeFall {
      0% { transform: translateY(0) scale(0.88); opacity: 0; }
      14% { opacity: 1; }
      80% { transform: translateY(72vh) scale(1.02); opacity: 1; }
      100% { transform: translateY(88vh) scale(0.96); opacity: 0; }
    }

    @keyframes runeSpin {
      0% { rotate: -12deg; }
      50% { rotate: 8deg; }
      100% { rotate: -2deg; }
    }

    @keyframes runeRipple {
      from { opacity: 0.46; transform: scale(0.9); }
      to { opacity: 0; transform: scale(1.16); }
    }

    @media (max-width: 980px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .runes {
        justify-content: flex-start;
      }

      .title-panel {
        width: min(390px, calc(100% - 40px));
      }
    }

    @media (max-width: 780px) {
      .shell {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero {
        border-radius: 28px;
      }

      .title-panel {
        left: 18px;
        top: 18px;
        width: calc(100% - 36px);
        padding: 18px;
      }

      .focus-card {
        left: 18px;
        right: 18px;
        bottom: 18px;
        width: auto;
      }

      .footer {
        grid-template-columns: 1fr;
        justify-items: start;
      }

      .footer-text {
        text-align: left;
      }
    }

    @media (max-width: 560px) {
      .runes {
        gap: 8px;
        padding: 8px 10px;
      }

      .rune {
        width: 50px;
        height: 50px;
        font-size: 24px;
      }

      .title-panel h1 {
        font-size: 42px;
      }

      .title-panel p,
      .focus-card p {
        font-size: 12px;
      }

      .chip {
        min-width: calc(50% - 5px);
      }
    }
  </style>
</head>
<body>
  <div id="app" aria-label="&#35328;&#28789; floating dreamworld home"></div>
  <script>
    (function () {
      try {
        var app = document.getElementById("app");

        var stageData = [
          {
            id: 0,
            stage: "Stage 1",
            title: "\u6686\u5149\u68ee\u68a6",
            desc: "\u6696\u6a59\u8272\u68ee\u6797\u5c9b\uff0c\u68a6\u5883\u690d\u7269\u3001\u6728\u8d28\u8df3\u53f0\u4e0e\u67d4\u548c\u7075\u5149\u6d6e\u5728\u6811\u51a0\u4e0a\u65b9\u3002",
            tags: ["Forest Glow", "Warm Wind", "Soft Physics"],
            glow: "rgba(255, 176, 112, 0.44)",
            top1: "#ffb07a",
            top2: "#ffd166",
            x: 18,
            y: 16,
            w: 28,
            h: 26,
            z: 5,
            scale: 0.92,
            float: "8.4s",
            focusX: 14,
            focusY: 12,
            focusScale: 1.18
          },
          {
            id: 1,
            stage: "Stage 2",
            title: "\u84dd\u7d2b\u5931\u91cd\u5c9b",
            desc: "\u84dd\u7d2b\u8272\u5931\u91cd\u6d6e\u754c\uff0c\u661f\u5c18\u3001\u6c34\u6676\u4e0e\u53cd\u91cd\u529b\u77f3\u5757\u5728\u7a7a\u4e2d\u76f8\u4e92\u62c9\u626f\u3002",
            tags: ["Crystal Drift", "Blue Void", "Zero Gravity"],
            glow: "rgba(128, 154, 255, 0.42)",
            top1: "#6eb7ff",
            top2: "#8b6be8",
            x: 63,
            y: 21,
            w: 24,
            h: 23,
            z: 4,
            scale: 0.86,
            float: "7.6s",
            focusX: -16,
            focusY: 10,
            focusScale: 1.22
          },
          {
            id: 2,
            stage: "Stage 3",
            title: "\u708e\u9699\u626d\u57df",
            desc: "\u7ea2\u6a59\u8272\u626d\u66f2\u5c9b\u5c7f\uff0c\u788e\u88c2\u5e73\u53f0\u4e0e\u53d1\u5149\u88c2\u7f1d\u628a\u7a7a\u95f4\u62c9\u6210\u4e0d\u7a33\u5b9a\u7684\u8bd7\u53e5\u3002",
            tags: ["Ember Rift", "Broken Space", "Fire Script"],
            glow: "rgba(255, 138, 98, 0.42)",
            top1: "#ff8f62",
            top2: "#ffcf70",
            x: 34,
            y: 56,
            w: 34,
            h: 28,
            z: 6,
            scale: 1,
            float: "9.2s",
            focusX: 4,
            focusY: -12,
            focusScale: 1.14
          }
        ];

        var runes = [
          { text: "\u706b", tone: "linear-gradient(135deg, #ff7d67, #ffb166)", glow: "rgba(255, 145, 93, 0.62)" },
          { text: "\u8f7b", tone: "linear-gradient(135deg, #59d9c2, #88f0d7)", glow: "rgba(89, 217, 194, 0.56)" },
          { text: "\u5206", tone: "linear-gradient(135deg, #8b6be8, #bf7bff)", glow: "rgba(165, 123, 255, 0.58)" },
          { text: "\u51b0", tone: "linear-gradient(135deg, #5da9e9, #8dd8ff)", glow: "rgba(125, 205, 255, 0.56)" }
        ];

        app.innerHTML = [
          '<main class="shell">',
          '  <header class="topbar">',
          '    <div class="top-info">',
          '      <div class="chip"><span>World State</span><strong id="focusStage">Stage 1</strong></div>',
          '      <div class="chip"><span>Dream Mood</span><strong id="focusMood">Warm Forest Glow</strong></div>',
          '    </div>',
          '    <div class="runes" id="runeBar" aria-label="Rule runes"></div>',
          '  </header>',
          '  <section class="hero">',
          '    <div class="sky"></div>',
          '    <div class="clouds"></div>',
          '    <div class="mountains"></div>',
          '    <div class="glow-fog"></div>',
          '    <div class="particles" id="particles"></div>',
          '    <div class="fragments" id="fragments"></div>',
          '    <div class="energy-streams" id="energyStreams"></div>',
          '    <div class="title-panel">',
          '      <span class="eyebrow">Dream rules are written in words</span>',
          '      <h1>&#35328;&#28789;</h1>',
          '      <p>&#36825;&#37324;&#19981;&#26159;&#33756;&#21333;&#39029;&#12290;&#19977;&#20010;&#20851;&#21345;&#26159;&#25955;&#33853;&#22312;&#31354;&#20013;&#30340;&#26790;&#22659;&#23707;&#23679;&#65292;&#20320;&#29992;&#27721;&#23383;&#35302;&#30896;&#23427;&#20204;&#65292;&#28982;&#21518;&#36827;&#20837;&#34987;&#35821;&#35328;&#25913;&#20889;&#30340;&#19990;&#30028;&#12290;</p>',
          '      <div class="actions">',
          '        <button class="cta" type="button" id="enterBtn">Enter Focused Realm</button>',
          '        <button class="ghost" type="button" id="wanderBtn">Wander</button>',
          '      </div>',
          '    </div>',
          '    <div class="world-window">',
          '      <div class="world-map" id="worldMap">',
          '        <div class="path-highlight" id="pathHighlight"></div>',
          '      </div>',
          '    </div>',
          '    <aside class="focus-card">',
          '      <small>Focused Realm</small>',
          '      <h2 id="focusTitle"></h2>',
          '      <p id="focusDesc"></p>',
          '      <div class="tags" id="focusTags"></div>',
          '    </aside>',
          '    <div class="dropline" id="dropline"></div>',
          '  </section>',
          '  <footer class="footer">',
          '    <div class="pulse">Living dreamworld / floating islands / glowing words</div>',
          '    <div class="footer-text">Click the islands inside the world, not a menu</div>',
          '    <div class="orbital">3 realms / one continuous sky</div>',
          '  </footer>',
          '</main>'
        ].join("");

        var root = document.documentElement;
        var runeBar = document.getElementById("runeBar");
        var worldMap = document.getElementById("worldMap");
        var focusTitle = document.getElementById("focusTitle");
        var focusDesc = document.getElementById("focusDesc");
        var focusTags = document.getElementById("focusTags");
        var focusStage = document.getElementById("focusStage");
        var focusMood = document.getElementById("focusMood");
        var pathHighlight = document.getElementById("pathHighlight");
        var dropline = document.getElementById("dropline");
        var wanderBtn = document.getElementById("wanderBtn");
        var enterBtn = document.getElementById("enterBtn");
        var currentStage = 0;
        var islands = [];

        buildRunes();
        buildAmbient();
        buildWorld();
        setStage(0);

        wanderBtn.addEventListener("click", function () {
          setStage((currentStage + 1) % stageData.length);
        });

        enterBtn.addEventListener("click", function () {
          spawnRune(runes[currentStage % runes.length], 50);
        });

        function buildRunes() {
          runes.forEach(function (rune, index) {
            var button = document.createElement("button");
            button.className = "rune";
            button.type = "button";
            button.textContent = rune.text;
            button.style.setProperty("--tone", rune.tone);
            button.style.setProperty("--glow", rune.glow);
            button.setAttribute("aria-label", "Rune " + rune.text);
            button.addEventListener("click", function () {
              button.classList.remove("active");
              void button.offsetWidth;
              button.classList.add("active");
              spawnRune(rune, 24 + index * 16 + Math.random() * 8);
            });
            runeBar.appendChild(button);
          });
        }

        function buildAmbient() {
          fillParticles(document.getElementById("particles"));
          fillFragments(document.getElementById("fragments"));
          drawPaths();
        }

        function buildWorld() {
          stageData.forEach(function (stage) {
            var button = document.createElement("button");
            button.className = "island";
            button.type = "button";
            button.dataset.stage = String(stage.id);
            button.style.left = stage.x + "%";
            button.style.top = stage.y + "%";
            button.style.width = stage.w + "%";
            button.style.height = stage.h + "%";
            button.style.setProperty("--z", String(stage.z));
            button.style.setProperty("--float", stage.float);
            button.style.setProperty("--glow", stage.glow);
            button.style.setProperty("--top1", stage.top1);
            button.style.setProperty("--top2", stage.top2);
            button.style.transform = "scale(" + stage.scale + ")";
            button.innerHTML = islandMarkup(stage);
            button.addEventListener("click", function () {
              setStage(stage.id);
            });
            worldMap.appendChild(button);
            islands.push(button);
          });
        }

        function islandMarkup(stage) {
          var detail = '';
          if (stage.id === 0) {
            detail = [
              '<span style="left:18%; top:34%; width:10%; height:24%; border-radius:999px; background:linear-gradient(180deg, rgba(255,245,190,0.95), rgba(255,158,109,0.82)); box-shadow:0 0 16px rgba(255,201,103,0.28);"></span>',
              '<span style="left:26%; top:20%; width:44%; height:30%; border-radius:50%; background:radial-gradient(circle at 30% 40%, rgba(255,209,102,0.86), transparent 28%), radial-gradient(circle at 66% 48%, rgba(255,158,109,0.84), transparent 30%), radial-gradient(circle at 50% 60%, rgba(89,217,194,0.42), transparent 36%); filter:blur(2px);"></span>',
              '<span style="left:12%; top:56%; width:18%; height:10%; border-radius:18px; background:linear-gradient(135deg, #d68f61, #f7cb7f); transform:rotate(-8deg);"></span>',
              '<span style="left:64%; top:52%; width:16%; height:10%; border-radius:18px; background:linear-gradient(135deg, #f5a870, #ffd166); transform:rotate(8deg);"></span>',
              '<span style="left:54%; top:26%; width:8%; height:8%; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,209,102,0.2) 68%, transparent 72%); box-shadow:0 0 14px rgba(255,209,102,0.5);"></span>'
            ].join("");
          } else if (stage.id === 1) {
            detail = [
              '<span style="left:18%; top:28%; width:10%; height:18%; background:linear-gradient(180deg, #a1d5ff, #6fa7ff); clip-path:polygon(50% 0%, 100% 32%, 72% 100%, 18% 90%, 0% 38%); transform:rotate(-10deg);"></span>',
              '<span style="left:64%; top:24%; width:12%; height:24%; background:linear-gradient(180deg, #c19cff, #7b79ff); clip-path:polygon(50% 0%, 100% 32%, 72% 100%, 18% 90%, 0% 38%); transform:rotate(10deg);"></span>',
              '<span style="left:26%; top:58%; width:18%; height:8%; border-radius:18px; background:linear-gradient(135deg, #5da9e9, #8b6be8); transform:rotate(12deg);"></span>',
              '<span style="left:54%; top:54%; width:20%; height:8%; border-radius:18px; background:linear-gradient(135deg, #8b6be8, #5da9e9); transform:rotate(-8deg);"></span>',
              '<span style="left:42%; top:32%; width:16%; height:16%; border-radius:50%; border:1px solid rgba(255,255,255,0.28); box-shadow:0 0 16px rgba(125,205,255,0.24);"></span>'
            ].join("");
          } else {
            detail = [
              '<span style="left:16%; top:52%; width:22%; height:8%; border-radius:18px; background:linear-gradient(135deg, #ff8f62, #ffcf70); transform:rotate(-12deg);"></span>',
              '<span style="left:52%; top:44%; width:22%; height:8%; border-radius:18px; background:linear-gradient(135deg, #ffb06f, #ff7f67); transform:rotate(10deg);"></span>',
              '<span style="left:38%; top:20%; width:24%; height:36%; background:linear-gradient(180deg, rgba(255,208,133,0.76), rgba(255,127,103,0.28)); clip-path:polygon(48% 0%, 56% 0%, 62% 100%, 40% 100%); filter:blur(2px);"></span>',
              '<span style="left:24%; top:26%; width:10%; height:10%; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,159,98,0.22) 68%, transparent 72%); box-shadow:0 0 16px rgba(255,159,98,0.48);"></span>',
              '<span style="left:68%; top:24%; width:10%; height:10%; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,208,112,0.22) 68%, transparent 72%); box-shadow:0 0 16px rgba(255,208,112,0.48);"></span>'
            ].join("");
          }

          return [
            '<div class="island-visual">',
            '  <div class="halo"></div>',
            '  <div class="land"></div>',
            '  <div class="underside"></div>',
            '  <div class="detail">' + detail + '</div>',
            '</div>'
          ].join("");
        }

        function setStage(index) {
          currentStage = index;
          var stage = stageData[index];
          root.style.setProperty("--focus-x", stage.focusX + "px");
          root.style.setProperty("--focus-y", stage.focusY + "px");
          root.style.setProperty("--focus-scale", String(stage.focusScale));
          focusTitle.textContent = stage.title;
          focusDesc.textContent = stage.desc;
          focusStage.textContent = stage.stage;
          focusMood.textContent = stage.tags[0];
          focusTags.innerHTML = "";
          stage.tags.forEach(function (tag) {
            var chip = document.createElement("span");
            chip.textContent = tag;
            focusTags.appendChild(chip);
          });

          islands.forEach(function (island, i) {
            island.classList.toggle("active", i === index);
          });

          placeOrb(stage);
        }

        function placeOrb(stage) {
          var old = document.querySelector(".orb-avatar");
          if (old && old.parentNode) {
            old.parentNode.removeChild(old);
          }

          var orb = document.createElement("div");
          orb.className = "orb-avatar";
          orb.style.left = stage.id === 0 ? "56%" : (stage.id === 1 ? "28%" : "66%");
          orb.style.top = stage.id === 0 ? "28%" : (stage.id === 1 ? "56%" : "30%");
          islands[stage.id].appendChild(orb);
        }

        function drawPaths() {
          pathHighlight.innerHTML = [
            '<svg viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">',
            '  <defs>',
            '    <linearGradient id="pathA" x1="0%" y1="0%" x2="100%" y2="100%">',
            '      <stop offset="0%" stop-color="rgba(255,209,102,0.0)"></stop>',
            '      <stop offset="38%" stop-color="rgba(255,209,102,0.75)"></stop>',
            '      <stop offset="68%" stop-color="rgba(125,205,255,0.56)"></stop>',
            '      <stop offset="100%" stop-color="rgba(139,107,232,0.0)"></stop>',
            '    </linearGradient>',
            '    <linearGradient id="pathB" x1="0%" y1="0%" x2="100%" y2="100%">',
            '      <stop offset="0%" stop-color="rgba(255,158,109,0.0)"></stop>',
            '      <stop offset="46%" stop-color="rgba(255,158,109,0.68)"></stop>',
            '      <stop offset="74%" stop-color="rgba(139,107,232,0.46)"></stop>',
            '      <stop offset="100%" stop-color="rgba(139,107,232,0.0)"></stop>',
            '    </linearGradient>',
            '  </defs>',
            '  <path d="M220 180 C340 230, 390 310, 520 286 S710 208, 760 220" fill="none" stroke="url(#pathA)" stroke-width="4" stroke-linecap="round" opacity="0.72"></path>',
            '  <path d="M300 430 C410 390, 500 348, 610 308 S760 266, 790 240" fill="none" stroke="url(#pathB)" stroke-width="4" stroke-linecap="round" opacity="0.58"></path>',
            '  <path d="M252 214 C392 256, 464 326, 610 324" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.42"></path>',
            '</svg>'
          ].join("");
        }

        function spawnRune(rune, percentX) {
          var glyph = document.createElement("div");
          glyph.className = "falling-rune";
          glyph.textContent = rune.text;
          glyph.style.setProperty("--x", percentX + "%");
          glyph.style.setProperty("--tone", rune.tone);
          glyph.style.setProperty("--glow", rune.glow);
          dropline.appendChild(glyph);
          window.setTimeout(function () {
            if (glyph.parentNode) {
              glyph.parentNode.removeChild(glyph);
            }
          }, 3800);
        }

        function fillParticles(container) {
          for (var i = 0; i < 30; i += 1) {
            var p = document.createElement("span");
            p.style.left = Math.random() * 100 + "%";
            p.style.top = 16 + Math.random() * 64 + "%";
            p.style.setProperty("--size", 3 + Math.random() * 5 + "px");
            p.style.setProperty("--dur", 4 + Math.random() * 7 + "s");
            p.style.setProperty("--dx", (-20 + Math.random() * 40) + "px");
            p.style.setProperty("--dy", (-80 - Math.random() * 70) + "px");
            p.style.setProperty("--glow", ["rgba(255,209,102,0.38)", "rgba(125,205,255,0.34)", "rgba(163,123,255,0.34)"][i % 3]);
            container.appendChild(p);
          }
        }

        function fillFragments(container) {
          var chars = ["\u706b", "\u8f7b", "\u5206", "\u51b0", "\u68a6", "\u5149", "\u5f71", "\u98ce"];
          for (var i = 0; i < chars.length; i += 1) {
            var g = document.createElement("span");
            g.textContent = chars[i];
            g.style.left = 10 + i * 10 + "%";
            g.style.top = 12 + (i % 4) * 16 + "%";
            g.style.setProperty("--size", 18 + (i % 3) * 10 + "px");
            g.style.setProperty("--dur", 6 + i * 0.7 + "s");
            g.style.setProperty("--glow", ["rgba(255,158,109,0.2)", "rgba(93,169,233,0.2)", "rgba(139,107,232,0.22)"][i % 3]);
            container.appendChild(g);
          }
        }

        window.setInterval(function () {
          var rune = runes[Math.floor(Math.random() * runes.length)];
          spawnRune(rune, 20 + Math.random() * 60);
        }, 3200);
      } catch (error) {
        document.body.innerHTML = '<div class="error-state"><p>&#21734;&#21680;&#65292;&#20986;&#38169;&#20102;&#65292;&#35831;&#37325;&#21551;&#35797;&#35797;&#21543;~</p></div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
